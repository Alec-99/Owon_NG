name: Versioned app packages
on:
  workflow_dispatch:
  push:
    branches: ['codex/UI-001-app-foundation']
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm run check
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build versioned demo packages
        run: |
          python scripts/package.py python
          python scripts/package.py windows
          python scripts/package.py linux
          python scripts/package.py android
      - name: Smoke-test launchers and generate hashes
        run: |
          python -m unittest discover -s tests -p 'test_packaging.py' -v
          cd artifacts
          sha256sum Owon_NG-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Owon_NG-versioned-demo-packages
          path: artifacts/
