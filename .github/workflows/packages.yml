name: Native app packages
on:
  workflow_dispatch:
  push:
    branches: ['codex/UI-001-app-foundation']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-native.txt pyinstaller==6.14.2
      - name: Native UI checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_native.py -v
      - run: python scripts/package.py python
      - run: python scripts/package.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: Owon_NG-0.3.0-native
          path: artifacts/Owon_NG-0.3.0-*.zip
          if-no-files-found: error
