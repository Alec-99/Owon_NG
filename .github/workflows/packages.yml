name: Native app packages
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-native.txt pyinstaller==6.14.2
      - name: Acquisition and recording checks
        run: python -m unittest discover -s tests -p test_core.py -v
      - name: Decoder timing checks
        run: python -m unittest discover -s tests -p test_decoding.py -v
      - name: Native UI checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_native.py -v
      - name: Contrast and clarity checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_visual.py -v
      - name: Capture native Windows UI screenshots
        if: always()
        timeout-minutes: 3
        run: python scripts/capture_ui.py
      - run: python scripts/package.py python
      - run: python scripts/package.py windows
      - name: Check the actual packaged Windows EXE
        run: python scripts/check_windows_bundle.py
      - name: Retain visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Owon_NG-ui-screenshots
          path: artifacts/ui/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Owon_NG-native
          path: artifacts/Owon_NG-*-*.zip
          if-no-files-found: error
